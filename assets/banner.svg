<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 360" width="1440" height="360" role="img" aria-labelledby="t d">
  <title id="t">Abrahamic Texts Lab</title>
  <desc id="d">Three arcs link points on a line, beside the title "Abrahamic Texts Lab" and the subtitle "Comparative Text Analysis of the Abrahamic Traditions and Writings".</desc>
  <rect x="1" y="1" width="1438" height="358" rx="36" fill="#0f151c" stroke="#1f2b34" stroke-width="2"/>

  <!-- icon -->
  <g transform="translate(110 80)">
    <rect x="2" y="2" width="196" height="196" rx="44" fill="#111a22" stroke="#2b3a40" stroke-width="3"/>
    <g transform="translate(0 -16)">
    <line x1="32" y1="150" x2="168" y2="150" stroke="#2f414b" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 150 A60 60 0 0 1 160 150" fill="none" stroke="#e8b45a" stroke-width="9" stroke-linecap="round"/>
    <path d="M40 150 A30 30 0 0 1 100 150" fill="none" stroke="#7fc8a9" stroke-width="9" stroke-linecap="round"/>
    <path d="M100 150 A30 30 0 0 1 160 150" fill="none" stroke="#8fa8e8" stroke-width="9" stroke-linecap="round"/>
    <circle cx="40" cy="150" r="8" fill="#111a22" stroke="#e8edf2" stroke-width="4"/>
    <circle cx="100" cy="150" r="8" fill="#111a22" stroke="#e8edf2" stroke-width="4"/>
    <circle cx="160" cy="150" r="8" fill="#111a22" stroke="#e8edf2" stroke-width="4"/>
    <circle cx="100" cy="90" r="9" fill="#e8b45a"/>
    </g>
  </g>

  <!-- title and subtitle -->
  <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="350" y="172" font-size="100" font-weight="700" letter-spacing="-2.5" fill="#e8edf2">Abrahamic Texts <tspan fill="#e8b45a">Lab</tspan></text>
    <text x="354" y="234" font-size="38" font-weight="500" fill="#98a4b0">Comparative Text Analysis of</text>
    <text x="354" y="282" font-size="38" font-weight="500" fill="#98a4b0">the Abrahamic Traditions and Writings</text>
  </g>
</svg>
