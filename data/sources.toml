# Machine-readable source manifest. SOURCES.md is the human-readable view.
# status: ready   = primary page checked, URL known, safe for scripts/fetch_sources.py
#         verify  = a license or URL detail is still unconfirmed; the script refuses it
#         manual  = needs a human step (e.g. accepting terms in a browser)
#         blocked = no usable open source yet; do not fetch or publish
# Verified 2026-11-24 from each source's own page unless a note says otherwise.

